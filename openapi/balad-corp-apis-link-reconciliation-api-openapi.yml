      summary: Reconciliation
      deprecated: false
      description: Fetch account reconciliation details including opening & closing balances and transaction history.
      tags:
      - APIs/Link/Reconciliation
      parameters:
      - name: start_date
        in: query
        description: ''
        required: false
        example: 16-Nov-2025
        schema:
          type: string
      - name: end_date
        in: query
        description: ''
        required: false
        example: 16-Nov-2025
        schema:
          type: string
      - name: page_no
        in: query
        description: ''
        required: false
        example: '1'
        schema:
          type: string
      - name: page_size
        in: query
        description: ''
        required: false
        example: '50'
        schema:
          type: string
      - name: Content-Type
        in: header
        description: ''
        required: false
        example: application/json
        schema:
          type: string

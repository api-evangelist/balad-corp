                    type: string
                  token_type:
                    type: string
                  expires_in:
                    type: integer
                  scope:
                    type: string
                required:
                - access_token
                - token_type
                - expires_in
                - scope
                x-apidog-orders:
                - access_token
                - token_type
                - expires_in
                - scope
              example:
                access_token: XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX

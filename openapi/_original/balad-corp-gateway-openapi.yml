  /identity/v1/token:
    post:
      summary: Token
      deprecated: false
      description: "### Request\n\nThis API is intended to allow the Partner to authenticate and obtain\
        \ an access token from B. The Partner sends their `client_id` and `client_secret` (using `grant_type:\
        \ client_credentials`) to B's token endpoint. B validates these credentials and, if successful,\
        \ returns a Bearer `access_token`, `token_type`, and `expires_in`. This access token must be included\
        \ in the `Authorization` header (e.g., `Authorization: Bearer` ) for all subsequent API calls\
        \ to B's protected resources.\n\n#### Request Body\n\n- This request uses the `x-www-form-urlencoded`\
        \ body type.\n    \n\n### Response\n\nThe response for this request is a JSON object with the\
        \ following properties:\n\n- `access_token` (string): The access token for the identity verification.\n\
        \    \n- `token_type` (string): The type of token.\n    \n- `expires_in` (integer): The duration\
        \ for which the token is valid.\n    \n- `scope` (string): The scope of the token."
      tags:
      - APIs/Authentication
      parameters:
      - name: Content-Type
        in: header
        description: ''
        required: true
        example: application/x-www-form-urlencoded
        schema:
          type: string
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                grant_type:
                  example: client_credentials
                  type: string
                client_id:
                  example: xxxx-xxx-xxx-xxxx-xxx
                  type: string
                client_secret:
                  example: xxxxxxxxxxxxxxxxxxxxxxxxx
                  type: string
              required:

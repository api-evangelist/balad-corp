openapi: 3.0.1
info:
  title: Balad Gateway APIs/Authentication APIs/Core/Exchange rate API
  description: Balad Gateway APIs — a suite of RESTful endpoints for secure inward cross-border remittances and payouts into Egypt (bank transfers, mobile wallets, cash pickup). Covers authentication, exchange rates, balance, secrets management, lookups, and the full transaction lifecycle. Assembled by API Evangelist from the provider's per-operation OpenAPI fragments published on developers.balad.tech.
  version: 1.0.0
  contact:
    name: Balad Support
    email: support@balad.me
    url: https://developers.balad.tech/
servers: []
tags:
- name: APIs/Core/Exchange rate
paths:
  /core/services/{serviceId}/exchange-rates:
    get:
      summary: Exchange Rates
      deprecated: false
      description: The "Get Exchange Rate" API  retrieves the current exchange rates available for a partner based on a specified service.
      tags:
      - APIs/Core/Exchange rate
      parameters:
      - name: serviceId
        in: path
        description: 'The unique identifier for the service. This parameter specifies the service for which exchange rates are being requested.

          1 = Balad Link, 2 = Balad Money, 3 = Balad Bills, 4 = Balad Collection, 5 = Balad VAS'
        required: true
        example: 1
        schema:
          type: integer
      - name: Content-Type
        in: header
        description: ''
        required: false
        example: application/json
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          minimum: null
                        from_currency:
                          type: string
                          examples:
                          - USD
                          - EGP
                        from_currency_id:
                          type: integer
                        to_currency:
                          type: string
                          examples:
                          - EGP
                          - USD
                        to_currency_id:
                          type: integer
                        rate:
                          type: number
                      x-apidog-orders:
                      - id
                      - from_currency
                      - from_currency_id
                      - to_currency
                      - to_currency_id
                      - rate
                      required:
                      - id
                      - from_currency
                      - from_currency_id
                      - to_currency
                      - to_currency_id
                      - rate
                  errors:
                    type: 'null'
                required:
                - data
                - errors
                x-apidog-orders:
                - data
                - errors
              example:
                data:
                - id: 43
                  from_currency: USD
                  from_currency_id: 1
                  to_currency: EGP
                  to_currency_id: 42
                  rate: 48.497228
                errors: null
          headers: {}
          x-apidog-name: Success
      security:
      - Balad Token: []
        x-apidog:
          required: true
          schemeGroups:
          - id: 87aTaQp8pR3_G2Uh_UKds
            schemeIds:
            - Balad Token
          use:
            id: 87aTaQp8pR3_G2Uh_UKds
      x-apidog-folder: APIs/Core/Exchange rate
      x-apidog-status: released
      x-run-in-apidog: https://app.apidog.com/web/project/1056134/apis/api-20919908-run
components:
  securitySchemes:
    Balad Token:
      type: bearer
      scheme: bearer
    bearer:
      type: http
      scheme: bearer

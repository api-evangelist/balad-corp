idempotency:
  supported: true
  mechanism: client-supplied-reference
  field: remitter_reference_no
  behavior: >-
    Each transaction is created with a partner-supplied unique remitter_reference_no.
    Submitting a duplicate reference is rejected with error code 129 (Duplicate reference),
    so the reference acts as an idempotency/deduplication key for Create Transaction.
  no_dedicated_header: true
  note: Balad does not expose a dedicated Idempotency-Key header; dedup is via remitter_reference_no.

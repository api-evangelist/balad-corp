aid: balad-corp
name: BALAD CORP
description: >-
  BALAD CORP (Balad) is a Cairo-based fintech providing cross-border payout and inward-remittance
  infrastructure for Egypt. Its Balad Gateway APIs let money transfer operators (MTOs), RemTechs,
  and superapps pay out to Egyptian beneficiaries via bank transfer to CBE-licensed banks over IPN,
  mobile wallets, and cash pickup at agent locations nationwide. The REST APIs are secured with
  OAuth 2.0 client credentials and cover exchange rates, balances, secrets management, lookups,
  transaction creation, status tracking, reconciliation, and HMAC-signed status webhooks, with a
  full sandbox for testing. Balad is backed by 500 Global, Acasia Ventures, First Circle Capital,
  Future Africa, and Launch Africa Ventures.
